<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 680" width="600" height="680" role="img" aria-label="Anonymous operator — hooded silhouette rendered in phosphor green">
  <defs>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#2bf5a4"/>
      <stop offset="55%"  stop-color="#35d6ff"/>
      <stop offset="100%" stop-color="#2bf5a4"/>
    </linearGradient>

    <linearGradient id="hood" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%"   stop-color="#16232e"/>
      <stop offset="60%"  stop-color="#0b131b"/>
      <stop offset="100%" stop-color="#04070a"/>
    </linearGradient>

    <radialGradient id="halo" cx="0.5" cy="0.34" r="0.55">
      <stop offset="0%"   stop-color="#2bf5a4" stop-opacity="0.30"/>
      <stop offset="60%"  stop-color="#2bf5a4" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#2bf5a4" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="void" cx="0.5" cy="0.45" r="0.6">
      <stop offset="0%"   stop-color="#020406"/>
      <stop offset="100%" stop-color="#050a0f"/>
    </radialGradient>

    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <filter id="softglow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1.4" fill="#000" opacity="0.42"/>
    </pattern>

    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0 H0 V30" fill="none" stroke="#2bf5a4" stroke-width="0.5" opacity="0.10"/>
    </pattern>

    <clipPath id="frame"><rect x="0" y="0" width="600" height="680"/></clipPath>
  </defs>

  <g clip-path="url(#frame)" font-family="'JetBrains Mono', ui-monospace, monospace">
    <!-- backdrop -->
    <rect width="600" height="680" fill="#04070a"/>
    <rect width="600" height="680" fill="url(#grid)"/>
    <ellipse cx="300" cy="250" rx="300" ry="280" fill="url(#halo)"/>

    <!-- glyph rain behind the figure -->
    <g fill="#2bf5a4" font-size="15" letter-spacing="1">
      <text x="24"  y="60"  opacity="0.20">01001101</text>
      <text x="24"  y="120" opacity="0.12">アクセス</text>
      <text x="24"  y="180" opacity="0.22">0x7F3A</text>
      <text x="24"  y="240" opacity="0.10">ルート権限</text>
      <text x="24"  y="300" opacity="0.18">#!/bin/sh</text>
      <text x="24"  y="360" opacity="0.10">11010010</text>
      <text x="486" y="90"  opacity="0.16">SEGV</text>
      <text x="470" y="150" opacity="0.22">0b1011</text>
      <text x="470" y="210" opacity="0.10">カギ</text>
      <text x="462" y="270" opacity="0.18">chmod+x</text>
      <text x="470" y="330" opacity="0.12">ACK/SYN</text>
      <text x="474" y="390" opacity="0.20">00111</text>
      <text x="40"  y="440" opacity="0.10">while(true){</text>
      <text x="430" y="450" opacity="0.10">}//exit 0</text>
    </g>

    <!-- shoulders + hood silhouette -->
    <path d="M300 74
             C 384 74 436 146 438 216
             C 440 258 424 292 406 314
             L 436 344
             C 524 378 566 448 580 540
             L 580 690 L 20 690 L 20 540
             C 34 448 76 378 164 344
             L 194 314
             C 176 292 160 258 162 216
             C 164 146 216 74 300 74 Z"
          fill="url(#hood)" stroke="url(#rim)" stroke-width="2.6" stroke-opacity="1" filter="url(#softglow)"/>

    <!-- inner hood shadow / face void -->
    <ellipse cx="300" cy="238" rx="96" ry="116" fill="url(#void)"/>
    <ellipse cx="300" cy="238" rx="96" ry="116" fill="none" stroke="#2bf5a4" stroke-width="1" stroke-opacity="0.22"/>

    <!-- visor slits -->
    <g filter="url(#glow)">
      <rect x="246" y="228" width="44" height="11" rx="5.5" fill="#2bf5a4"/>
      <rect x="310" y="228" width="44" height="11" rx="5.5" fill="#2bf5a4"/>
    </g>
    <rect x="246" y="228" width="44" height="11" rx="5.5" fill="#ccfff0"/>
    <rect x="310" y="228" width="44" height="11" rx="5.5" fill="#ccfff0"/>

    <!-- chest readout -->
    <g filter="url(#softglow)" opacity="0.9">
      <rect x="252" y="470" width="96" height="2.5" fill="#2bf5a4" opacity="0.65"/>
      <rect x="252" y="482" width="62" height="2.5" fill="#2bf5a4" opacity="0.40"/>
      <rect x="252" y="494" width="78" height="2.5" fill="#2bf5a4" opacity="0.25"/>
    </g>

    <!-- hood seam highlights -->
    <path d="M206 300 C 232 330 368 330 394 300" fill="none" stroke="#2bf5a4" stroke-width="1.2" stroke-opacity="0.30"/>
    <path d="M176 352 C 236 396 364 396 424 352" fill="none" stroke="#2bf5a4" stroke-width="1.2" stroke-opacity="0.18"/>

    <!-- corner brackets -->
    <g stroke="#2bf5a4" stroke-width="2" fill="none" opacity="0.75">
      <path d="M22 60 V22 H60"/>
      <path d="M578 60 V22 H540"/>
      <path d="M22 620 V658 H60"/>
      <path d="M578 620 V658 H540"/>
    </g>

    <!-- telemetry text -->
    <g fill="#2bf5a4" font-size="13" letter-spacing="2.2">
      <text x="40" y="48" opacity="0.5">SIG//0x4D52</text>
      <text x="560" y="48" opacity="0.5" text-anchor="end">REC ●</text>
    </g>

    <!-- CRT scanlines -->
    <rect width="600" height="680" fill="url(#scan)"/>
    <rect width="600" height="680" fill="none" stroke="#2bf5a4" stroke-opacity="0.18" stroke-width="2"/>
  </g>
</svg>
