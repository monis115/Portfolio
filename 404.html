<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>404 — segment not found</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%2304070a'/%3E%3Ctext x='50' y='70' font-family='monospace' font-size='62' font-weight='700' fill='%232bf5a4' text-anchor='middle'%3E%26gt;_%3C/text%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0}
  body{min-height:100svh;display:grid;place-items:center;padding:24px;background:#04070a;color:#d6e3ea;
       font-family:"JetBrains Mono",ui-monospace,monospace;line-height:1.7}
  .bg{position:fixed;inset:0;pointer-events:none;
      background-image:linear-gradient(rgba(120,255,205,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(120,255,205,.045) 1px,transparent 1px);
      background-size:64px 64px;
      mask-image:radial-gradient(ellipse 100% 70% at 50% 0%,#000 10%,transparent 75%)}
  .scan{position:fixed;inset:0;pointer-events:none;
        background:repeating-linear-gradient(to bottom,rgba(255,255,255,.022) 0 1px,transparent 1px 3px)}
  .box{position:relative;z-index:2;width:min(620px,100%);border:1px solid rgba(120,255,205,.18);background:rgba(9,14,20,.72)}
  .bar{display:flex;gap:6px;align-items:center;padding:10px 14px;border-bottom:1px solid rgba(120,255,205,.14);font-size:11.5px;color:#4a5a67}
  .bar i{width:9px;height:9px;border-radius:50%;display:block}
  .body{padding:26px 22px 28px;font-size:13.5px}
  h1{font-size:clamp(46px,11vw,92px);line-height:1;letter-spacing:-.05em;color:#2bf5a4;text-shadow:0 0 30px rgba(43,245,164,.35)}
  p{color:#7f93a2;margin-top:14px}
  .ok{color:#2bf5a4}
  a.btn{display:inline-flex;margin-top:26px;padding:12px 20px;color:#2bf5a4;text-decoration:none;font-size:13px;
        border:1px solid rgba(120,255,205,.32);background:rgba(43,245,164,.05);transition:.25s}
  a.btn:hover{background:rgba(43,245,164,.16);box-shadow:0 0 40px rgba(43,245,164,.12)}
  .c{display:inline-block;width:9px;height:1em;background:#2bf5a4;vertical-align:text-bottom;animation:b 1s steps(1) infinite}
  @keyframes b{0%,49%{opacity:1}50%,100%{opacity:0}}
</style>
</head>
<body>
<div class="bg"></div><div class="scan"></div>
<div class="box">
  <div class="bar"><i style="background:#ff5470"></i><i style="background:#ffb454"></i><i style="background:#2bf5a4"></i>&nbsp;monis@portfolio — error</div>
  <div class="body">
    <h1>404</h1>
    <p><span class="ok">$</span> stat ./requested_resource<br>
       stat: cannot stat './requested_resource': No such file or directory</p>
    <p>This path doesn't exist on the node. The arsenal is back the other way.<span class="c"></span></p>
    <a class="btn" href="/Portfolio/">[ cd ~ ]</a>
  </div>
</div>
</body>
</html>
